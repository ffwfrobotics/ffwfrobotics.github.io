site_name: FFWF Robotics Docs
site_description: Documentation for Tectum, Tau, and JMFTS
site_url: https://ffwfrobotics.github.io/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  # No webfont fetch: the site stays self-contained and Courier/system-sans
  # are the intended faces anyway.
  font: false
  palette:
    - scheme: slate
      toggle:
        icon: material/skull
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/skull-outline
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/ffwf.css

# Expands the docstate table and integration roster from page frontmatter.
hooks:
  - hooks/docstate.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tectum:
      - tectum/index.md
      - Tutorials:
          - tectum/tutorials/index.md
          - Quickstart: tectum/tutorials/quickstart.md
      - Cookbook: tectum/cookbook.md
      - DevOps Manual: tectum/devops.md
      - Reference: tectum/reference.md
  - Tau:
      - tau/index.md
      - Tutorials:
          - tau/tutorials/index.md
          - Quickstart: tau/tutorials/quickstart.md
      - Cookbook: tau/cookbook.md
      - DevOps Manual: tau/devops.md
      - Reference:
          - tau/reference/index.md
          - tau_llm: tau/reference/tau-llm.md
          - tau_agent_core: tau/reference/tau-agent-core.md
          - Extensions: tau/reference/extensions.md
          - RPC: tau/reference/rpc.md
          - tau_coding_agent: tau/reference/tau-coding-agent.md
  - JMFTS:
      - jmfts/index.md
      - Tutorials:
          - jmfts/tutorials/index.md
          - Quickstart: jmfts/tutorials/quickstart.md
          - Ingest a document: jmfts/tutorials/ingest-a-document.md
      - Cookbook: jmfts/cookbook.md
      - DevOps Manual: jmfts/devops.md
      - Reference: jmfts/reference.md
  - Integrations:
      - integrations/index.md
      - Tectum + Tau: integrations/tectum-tau.md
      - Tectum + JMFTS: integrations/tectum-jmfts.md
      - Tau + JMFTS: integrations/tau-jmfts.md
      - The FFwF Full Stack Agent: integrations/full-stack-agent.md
  - Style guide: style-guide.md
