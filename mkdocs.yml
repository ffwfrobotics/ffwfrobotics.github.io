site_name: FFWF Robotics Docs
site_description: Documentation for Tectum, Tau, and JMFTS
site_url: https://ffwfrobotics.github.io/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  # No webfont fetch: the site stays self-contained and Courier/system-sans
  # are the intended faces anyway.
  font: false
  palette:
    - scheme: slate
      toggle:
        icon: material/skull
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/skull-outline
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/ffwf.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tectum:
      - Quickstart: tectum/quickstart.md
      - Tutorial: tectum/tutorial.md
      - Cookbook: tectum/cookbook.md
      - Reference: tectum/reference.md
  - Tau:
      - Quickstart: tau/quickstart.md
      - Tutorial: tau/tutorial.md
      - Cookbook: tau/cookbook.md
      - Reference: tau/reference.md
  - JMFTS:
      - Quickstart: jmfts/quickstart.md
      - Tutorial: jmfts/tutorial.md
      - Cookbook: jmfts/cookbook.md
      - Reference: jmfts/reference.md
  - Style guide: style-guide.md
